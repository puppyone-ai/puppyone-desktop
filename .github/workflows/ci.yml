name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_DESKTOP_CLOUD_API_URL: https://api.puppyone.ai/api/v1
      VITE_DESKTOP_CLOUD_WEB_URL: https://app.puppyone.ai

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test MDI focus continuity in Chromium
        run: xvfb-run --auto-servernum npm run smoke:markdown-pane-focus-continuity

      - name: Build
        run: npm run build
